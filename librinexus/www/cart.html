{% extends "templates/web.html" %}

{% block page_content %}
<script src="https://cdn.tailwindcss.com"></script>

<div class="bg-gray-50 min-h-screen py-10">
    <div class="container mx-auto px-4 max-w-4xl">
        <h1 class="text-3xl font-black text-gray-900 mb-8 flex items-center gap-3">
            <span>🛒</span> Your Shopping Cart
        </h1>

        <div id="cart-container" class="space-y-4">
            </div>

        <div id="empty-cart" class="hidden text-center py-20 bg-white rounded-2xl shadow-sm border border-gray-100">
            <div class="text-6xl mb-4">🕸️</div>
            <h2 class="text-xl font-bold text-gray-800">Your cart is empty</h2>
            <a href="/library" class="mt-4 inline-block text-orange-600 font-bold hover:underline">Go Shopping</a>
        </div>

        <div id="checkout-section" class="mt-8 bg-white p-6 rounded-2xl shadow-lg border border-gray-100 hidden">
            <div class="flex justify-between items-center text-xl font-bold text-gray-900 mb-6">
                <span>Total:</span>
                <span id="cart-total" class="text-orange-600">KSh 0</span>
            </div>
            
            <button onclick="checkoutWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg transition transform hover:-translate-y-1 flex items-center justify-center gap-2">
                <span>📲</span> Checkout on WhatsApp
            </button>
            
            <button onclick="clearCart()" class="mt-4 w-full text-gray-400 text-xs hover:text-red-500 underline">
                Clear Cart
            </button>
        </div>
    </div>
</div>

<script>
    // 1. LOAD CART
    const cart = JSON.parse(localStorage.getItem('nexusCart') || "[]");
    const container = document.getElementById('cart-container');
    const emptyMsg = document.getElementById('empty-cart');
    const checkoutSec = document.getElementById('checkout-section');
    const totalEl = document.getElementById('cart-total');

    if (cart.length === 0) {
        emptyMsg.classList.remove('hidden');
    } else {
        checkoutSec.classList.remove('hidden');
        let total = 0;

        cart.forEach((item, index) => {
            total += parseInt(item.price);
            
            // Create HTML for each item
            const itemHTML = `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <img src="${item.image}" class="w-16 h-20 object-cover rounded-md bg-gray-200">
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-900">${item.title}</h3>
                        <p class="text-sm text-gray-500">${item.author}</p>
                        <p class="text-orange-600 font-bold mt-1">KSh ${item.price}</p>
                    </div>
                    <button onclick="removeItem(${index})" class="text-gray-300 hover:text-red-500 p-2">
                        ✕
                    </button>
                </div>
            `;
            container.innerHTML += itemHTML;
        });

        totalEl.innerText = "KSh " + total.toLocaleString();
    }

    // 2. REMOVE ITEM
    function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem('nexusCart', JSON.stringify(cart));
        location.reload(); // Refresh to update view
    }

    // 3. CLEAR CART
    function clearCart() {
        localStorage.removeItem('nexusCart');
        location.reload();
    }

    // 4. WHATSAPP CHECKOUT
    function checkoutWhatsApp() {
        let message = "Hi, I want to order these books:\n";
        let total = 0;
        cart.forEach(item => {
            message += `- *${item.title}* (KSh ${item.price})\n`;
            total += parseInt(item.price);
        });
        message += `\n*Total: KSh ${total}*`;
        
        const url = `https://wa.me/254700000000?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }
</script>
{% endblock %}
